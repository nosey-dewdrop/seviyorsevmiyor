<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mockup 10 · mavi termal</title>
<link rel="stylesheet" href="fis-core.css">
<style>
  /* soğuk geometrik: mavi tek vurgu, doku yok, keskin dünya */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#040404; color:#a1a1aa; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 16px 96px; }
  .tag { position:fixed; top:10px; right:12px; font-size:10px; color:#3f3f46; }
  .stage { width:100%; max-width:560px; display:flex; flex-direction:column; }
  h1 { color:#fafafa; font-size:20px; font-weight:400; }
  h1 span { color:#6aa0ff; }
  .sub { font-size:12px; color:#71717a; margin:6px 0 36px; }
  textarea { width:100%; height:120px; background:transparent; border:1px solid #27272a; color:#fafafa; font:inherit; font-size:13px; padding:14px; resize:none; border-radius:0; }
  textarea:focus { outline:none; border-color:#6aa0ff; }
  .go { margin-top:12px; align-self:flex-start; background:#6aa0ff; color:#040404; border:0; font:inherit; font-size:13px; font-weight:700; padding:10px 22px; cursor:pointer; }

  .receipt-wrap { margin:60px auto 0; animation:print 2.2s cubic-bezier(.2,.8,.2,1) both .3s; }
  @keyframes print { from { clip-path:inset(0 0 100% 0); } to { clip-path:inset(0 0 0 0); } }
  /* soğuk kağıt: maviye çalan termal ton, mürekkep laciverte yakın */
  .receipt { background:#eef3fa; color:#101623; }
  .receipt .dash { border-top-color:#8fb4d6; }
  .receipt .r-meta, .receipt .center { color:#46536b; }
  .receipt .barcode { color:#101623; }
  .receipt .total { color:#0b3ea8; }
  .indir { margin:20px auto 0; display:block; background:transparent; border:1px solid #6aa0ff; color:#6aa0ff; font:inherit; font-size:12px; padding:9px 18px; cursor:pointer; }
</style>
</head>
<body>
<span class="tag">mockup 10 · mavi termal</span>
<div class="stage">
  <h1>mesajı bir <span>okusana</span></h1>
  <p class="sub">sohbeti bırak, hükmü al. mesajlar cihazdan çıkmaz.</p>
  <textarea readonly>Ben: naber, bugün ne yaptın?
O: iş güç işte
Ben: ben bugün o kafeye gittim hani beraber gitmiştik ya, aklıma sen geldin
O: hı
Ben: bu hafta sonu müsait misin? şu sergiye gidelim mi demiştik
O: bakarız
Ben: geçen de öyle demiştin ama :( özledim seni ya
O: yoğunum bu ara</textarea>
  <button class="go" type="button">bir okusana</button>
  <div class="receipt-wrap"><div class="receipt" data-fis></div></div>
  <button class="indir" type="button">fişi indir (1080x1920)</button>
</div>
<script src="fis.js"></script>
</body>
</html>
