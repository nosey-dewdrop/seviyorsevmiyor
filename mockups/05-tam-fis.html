<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mockup 05 · tam fiş (asi varyant)</title>
<link rel="stylesheet" href="fis-core.css">
<style>
  /* asi varyant: sitenin kendisi tek bir kağıt şerit. koyu dünya sadece masa. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0b0c; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; min-height:100vh; display:flex; justify-content:center; padding:40px 12px 80px; }
  .tag { position:fixed; top:10px; right:12px; font-size:10px; color:#3f3f46; }
  .paper { width:400px; background:#fafafa; color:#18181b; padding:34px 26px 40px; font-size:12px; line-height:1.8;
    filter:drop-shadow(0 24px 50px rgba(0,0,0,.95));
    clip-path:polygon(0 10px,4% 0,8% 10px,12% 0,16% 10px,20% 0,24% 10px,28% 0,32% 10px,36% 0,40% 10px,44% 0,48% 10px,52% 0,56% 10px,60% 0,64% 10px,68% 0,72% 10px,76% 0,80% 10px,84% 0,88% 10px,92% 0,96% 10px,100% 0,100% calc(100% - 10px),96% 100%,92% calc(100% - 10px),88% 100%,84% calc(100% - 10px),80% 100%,76% calc(100% - 10px),72% 100%,68% calc(100% - 10px),64% 100%,60% calc(100% - 10px),56% 100%,52% calc(100% - 10px),48% 100%,44% calc(100% - 10px),40% 100%,36% calc(100% - 10px),32% 100%,28% calc(100% - 10px),24% 100%,20% calc(100% - 10px),16% 100%,12% calc(100% - 10px),8% 100%,4% calc(100% - 10px),0 100%); }
  .p-head { text-align:center; font-size:16px; font-weight:700; letter-spacing:1px; }
  .p-sub { text-align:center; font-size:10px; color:#52525b; margin-bottom:14px; }
  .dash { border:0; border-top:1px dashed #a1a1aa; margin:10px 0; }
  .label { font-size:10px; color:#52525b; margin-bottom:4px; }
  textarea { width:100%; height:150px; background:#fafafa; border:1px dashed #a1a1aa; color:#18181b; font:inherit; font-size:11.5px; line-height:1.7; padding:10px; resize:none; border-radius:0; }
  textarea:focus { outline:none; border-color:#18181b; }
  .go { display:block; width:100%; margin-top:12px; background:#18181b; color:#fafafa; border:0; font:inherit; font-size:12px; font-weight:700; letter-spacing:1px; padding:12px; cursor:pointer; }
  /* fiş kağıdın devamı: ayrı kutu yok, aynı şeridin alt bölümü */
  .receipt { clip-path:none; padding:0; filter:none; background:transparent; }
  .receipt-wrap { width:auto; filter:none; }
</style>
</head>
<body>
<span class="tag">mockup 05 · tam fiş</span>
<div class="paper">
  <div class="p-head">MESAJI BİR OKUSANA</div>
  <div class="p-sub">SOHBETİ AŞAĞI YAPIŞTIR · HÜKÜM AYNI KAĞIDA BASILIR · MESAJLAR KİMSEYE GİTMEZ</div>
  <hr class="dash">
  <p class="label">SOHBET:</p>
  <textarea readonly>Ben: naber, bugün ne yaptın?
O: iş güç işte
Ben: ben bugün o kafeye gittim hani beraber gitmiştik ya, aklıma sen geldin
O: hı
Ben: bu hafta sonu müsait misin? şu sergiye gidelim mi demiştik
O: bakarız
Ben: geçen de öyle demiştin ama :( özledim seni ya
O: yoğunum bu ara</textarea>
  <button class="go" type="button">BİR OKUSANA</button>
  <hr class="dash">
  <div class="receipt-wrap"><div class="receipt" data-fis></div></div>
</div>
<script src="fis.js"></script>
</body>
</html>
