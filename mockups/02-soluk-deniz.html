<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mockup 02 · soluk deniz</title>
<link rel="stylesheet" href="fis-core.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050506; color:#a1a1aa; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 16px 96px; overflow-x:hidden; }
  .tag { position:fixed; top:10px; right:12px; font-size:10px; color:#3f3f46; z-index:3; }

  /* baloncuk denizi: atmosfer katmanı, ekranı bölmez */
  .sea { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .sea img { position:absolute; opacity:.14; width:90px; filter:saturate(.6); }
  .sea img:nth-child(2n) { width:64px; opacity:.10; }
  .sea img:nth-child(3n) { width:120px; opacity:.08; }

  .stage { position:relative; z-index:1; width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; }
  h1 { color:#fafafa; font-size:20px; font-weight:400; margin-bottom:6px; }
  .sub { font-size:12px; color:#71717a; margin-bottom:36px; }
  textarea { width:100%; height:120px; background:rgba(5,5,6,.85); border:1px solid #27272a; color:#fafafa; font:inherit; font-size:13px; padding:14px; resize:none; border-radius:0; }
  .go { margin-top:12px; align-self:flex-start; background:#fafafa; color:#050506; border:0; font:inherit; font-size:13px; padding:10px 22px; cursor:pointer; }

  .receipt-wrap { margin-top:60px; animation:print 2.4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes print { from { clip-path:inset(0 0 100% 0); transform:translateY(-24px); } to { clip-path:inset(0 0 0 0); transform:none; } }
</style>
</head>
<body>
<span class="tag">mockup 02 · soluk deniz</span>
<div class="sea" aria-hidden="true">
  <img src="../web/assets/bubbles/b00.png" style="top:6%;left:4%">
  <img src="../web/assets/bubbles/b01.png" style="top:18%;left:78%">
  <img src="../web/assets/bubbles/b02.png" style="top:34%;left:12%">
  <img src="../web/assets/bubbles/b03.png" style="top:52%;left:84%">
  <img src="../web/assets/bubbles/b04.png" style="top:66%;left:6%">
  <img src="../web/assets/bubbles/b00.png" style="top:78%;left:70%">
  <img src="../web/assets/bubbles/b02.png" style="top:8%;left:56%">
  <img src="../web/assets/bubbles/b03.png" style="top:88%;left:30%">
  <img src="../web/assets/bubbles/b01.png" style="top:44%;left:44%">
</div>
<div class="stage">
  <h1>mesajı bir okusana</h1>
  <p class="sub">sohbeti bırak, hükmü al. mesajlar cihazdan çıkmaz.</p>
  <textarea readonly>Ben: naber, bugün ne yaptın?
O: iş güç işte
Ben: ben bugün o kafeye gittim hani beraber gitmiştik ya, aklıma sen geldin
O: hı
Ben: bu hafta sonu müsait misin? şu sergiye gidelim mi demiştik
O: bakarız
Ben: geçen de öyle demiştin ama :( özledim seni ya
O: yoğunum bu ara</textarea>
  <button class="go" type="button">bir okusana</button>
  <div class="receipt-wrap"><div class="receipt" data-fis></div></div>
</div>
<script src="fis.js"></script>
</body>
</html>
