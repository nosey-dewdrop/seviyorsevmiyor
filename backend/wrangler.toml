name = "seviyorsevmiyor-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV for per-IP rate counters and daily totals.
#
# Message text DOES reach this worker now: /api/spiker receives the conversation with the visitor's
# explicit consent and forwards it to Groq. It is never written here. The chat is a local of
# handleSpiker(), it is put into one prompt, and the request ends; no KV key in this file or in
# worker.js holds a character of it. What lives here is counters, and /api/zaman and /api/itiraz
# still go through olguTemiz(), so the two routes that DO write to KV still carry numbers only.
# Namespace title is MESAJ_RATE_LIMIT (account already had a generic RATE_LIMIT from another worker).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "facdf8b5b45d493b808c18fe9fa3e7a1"

# Donated readings (/api/itiraz) must NOT share a namespace with rate counters: different
# data, different retention, different blast radius. A donated row is the twelve numeric model
# features plus the disputed verdict key — the conversation stays on the device and is not in the
# request body at all. Create the namespace once and uncomment:
#   npx wrangler kv namespace create CORPUS
# [[kv_namespaces]]
# binding = "CORPUS"
# id = "<paste the id wrangler prints>"
#
# THIS BINDING IS MISSING RIGHT NOW, so /api/itiraz is closed in production: it answers
# 503 {"eksik":["CORPUS"]} instead of writing donated rows into the rate-counter namespace.
# The worker used to fall back to RATE_LIMIT silently, which is how donations ended up in the wrong
# place with nobody able to see it. Uncomment the block above to reopen donations.

[vars]
# Only these origins may talk to the worker. Empty or missing => the worker returns 503 naming
# ALLOWED_ORIGINS. It never falls back to "*".
ALLOWED_ORIGINS = "https://nosey-dewdrop.github.io"

# Spiker (Groq/Llama voice layer). "on" = live; flip to "off" as the kill switch.
# Fuses in code: 6/min + 60/day per IP, 900/day global (Groq free tier is 1000/day).
SPIKER_OPEN = "on"

# Consented hard-case donation. Its own kill switch, so stopping content storage no longer means
# stopping the spiker too.
ITIRAZ_OPEN = "on"

# Secrets (never in this file), all three set via `npx wrangler secret put <NAME>`:
#   GROQ_API_KEY      — console.groq.com
#   TURNSTILE_SECRET  — Cloudflare dash > Turnstile > widget > secret key
#   BILET_SECRET      — any long random string, signs our own short-lived tickets
#                       e.g. openssl rand -hex 32
#
# The ticket gate switches itself on with TURNSTILE_SECRET:
#   TURNSTILE_SECRET set    => /api/spiker, /api/itiraz and /api/zaman all demand a valid ticket,
#                              and a missing BILET_SECRET makes them 503 by name.
#   TURNSTILE_SECRET unset  => /api/bilet, /api/itiraz and /api/zaman still 503 by name, but
#                              /api/spiker runs without a ticket. There is no challenge for the
#                              page to solve without a site key, so a ticket demand would close the
#                              main flow rather than protect it. The origin allowlist and the three
#                              quotas (6/min and 60/day per IP, 900/day global) stay on regardless.
#
# The Turnstile SITE key (public, not a secret) goes in web/js/api.js as TURNSTILE_SITEKEY. Fill it
# in there and set TURNSTILE_SECRET here and the gate turns on at both ends with no code change.
