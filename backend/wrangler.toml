name = "whatdoyoumean-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV for per-IP rate counters only (no content is ever stored).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_ID"

[vars]
# Set to "on" to open the tokenless browser fallback path (each call costs Gemini money).
PUBLIC_READ = "off"

# Secrets (never in this file): GEMINI_API_KEY, APP_TOKEN — set via `wrangler secret put`.
