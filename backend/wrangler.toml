name = "mesajibirokusana-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV for per-IP rate counters only (no content is ever stored).
# Namespace title is MESAJ_RATE_LIMIT (account already had a generic RATE_LIMIT from another worker).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "facdf8b5b45d493b808c18fe9fa3e7a1"

[vars]
# Spiker (Groq/Llama voice layer). "on" = live; flip to "off" as the kill switch.
# Fuses in code: 6/min + 60/day per IP, 2000/day global.
SPIKER_OPEN = "on"
# Legacy Gemini full-fallback path; stays "off" until we ever need it.
PUBLIC_READ = "off"

# Secrets (never in this file): GROQ_API_KEY (+ GEMINI_API_KEY, APP_TOKEN if /api/read opens)
# — set via `wrangler secret put`.
